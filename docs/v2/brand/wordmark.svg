<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="GreeCheck wordmark">
  <!-- GreeCheck wordmark · editorial, tight tracking, sprout accent on the
       second "e" of "Gree". Concept file: production cut converts text to
       outlines in the chosen editorial face (Fraunces 600 / fallback Inter 700). -->
  <text x="20" y="82"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="600" letter-spacing="-2"
        fill="#101312">Gree<tspan fill="#15803D">Check</tspan></text>
  <!-- sprout accent rising from the final "e" of Gree -->
  <g transform="translate(206,26)">
    <path d="M0 12 C 2 -2, 14 -10, 30 -12 C 28 4, 18 12, 2 14 Z" fill="#2ECC71"/>
    <path d="M4 10 C 10 2, 18 -4, 26 -8" fill="none" stroke="#0B3D2E" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
