<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GreeCheck PWA icon concept">
  <!-- GreeCheck PWA icon · maskable concept.
       Deep-green field, Sprout Check centered inside the 80% safe zone
       (409.6px circle). Export sizes: 512, 192, 180 (apple), maskable variants. -->
  <defs>
    <linearGradient id="pwa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D2E"/>
      <stop offset="1" stop-color="#0A2A20"/>
    </linearGradient>
    <linearGradient id="pwa-check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FAFAF7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- full-bleed field (maskable-safe) -->
  <rect width="512" height="512" fill="url(#pwa-bg)"/>
  <!-- subtle halo, top-right, echoes the app's ambient background -->
  <circle cx="430" cy="70" r="210" fill="#39FF88" opacity="0.07"/>

  <!-- mark centered in safe zone: scale 1.22, translated -->
  <g transform="translate(100,100) scale(1.22)">
    <g stroke="#FAFAF7" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M28 76 V48 a20 20 0 0 1 20 -20 h28"/>
      <path d="M180 28 h28 a20 20 0 0 1 20 20 v28"/>
      <path d="M228 180 v28 a20 20 0 0 1 -20 20 h-28"/>
      <path d="M76 228 h-28 a20 20 0 0 1 -20 -20 v-28"/>
    </g>
    <path d="M74 138 L114 178 L182 96"
          fill="none" stroke="url(#pwa-check)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M182 96 C 186 62, 208 44, 236 40 C 234 74, 214 94, 186 100 Z" fill="#39FF88"/>
  </g>
</svg>
